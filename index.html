<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark Check</title>
  <style>
    /* Base Page Styling with Animated Gradient & Pattern */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Prevents the page from creating scrollbars when the button flies around */
      overflow: hidden; 
      
      /* The new rich background */
      background: linear-gradient(-45deg, #FFB7D1, #FFD1E1, #D1EDFB, #D1FBFB);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Background decorative pattern */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(#ffffff 15%, transparent 16%), 
                        radial-gradient(#ffffff 15%, transparent 16%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }

    /* Main Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 40px 20px;
      width: 85%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 10;
    }

    /* Cat & Heart Icon Container */
    .icon-wrapper {
      margin: 0 auto 20px;
      position: relative;
      width: 80px;
      height: 80px;
    }

    .icon-placeholder {
      font-size: 70px;
      line-height: 1;
      position: relative;
      display: inline-block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    .heart-badge {
      position: absolute;
      top: -5px;
      right: -15px;
      font-size: 35px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Main Dynamic Text Formatting */
    .main-text {
      font-size: 26px;
      font-weight: 800;
      color: #333333;
      line-height: 1.25;
      margin: 0 0 30px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 5px rgba(255, 255, 255, 0.8);
    }

    /* Button Layout */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .btn {
      border: none;
      border-radius: 50px; 
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-yes {
      background: #FF8BA7; 
      color: white;
      box-shadow: 0 6px 15px rgba(255, 139, 167, 0.4);
    }
    
    .btn-yes:hover {
      box-shadow: 0 8px 20px rgba(255, 139, 167, 0.6);
    }

    .btn-no {
      background: #A1C4FD; 
      color: white;
      box-shadow: 0 6px 15px rgba(161, 196, 253, 0.4);
      /* Ensures the button stays on top when it moves out of the card */
      z-index: 100; 
    }

    .btn-no:hover {
      box-shadow: 0 8px 20px rgba(161, 196, 253, 0.6);
    }

    /* "No seems a bit shy" text */
    .subtext {
      font-style: italic;
      color: #9d3d75; 
      font-size: 13px;
      margin: 0;
      font-weight: 600;
    }

    /* Date Picker Section (Hidden initially) */
    .date-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .date-input {
      padding: 12px 18px;
      border-radius: 14px;
      border: 2px solid rgba(255, 139, 167, 0.6);
      background: rgba(255, 255, 255, 0.85);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #333333;
      outline: none;
      width: 80%;
      max-width: 240px;
      text-align: center;
      cursor: pointer;
    }

    .date-input:focus {
      border-color: #FF8BA7;
      box-shadow: 0 0 10px rgba(255, 139, 167, 0.3);
    }

    .date-error {
      color: #d6336c;
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      display: none;
    }
  </style>
</head>
<body>

  <!-- The Card Component -->
  <div class="card">
    
    <div class="icon-wrapper">
      <div class="icon-placeholder">🐱<span class="heart-badge">❤️</span></div>
    </div>

    <h1 class="main-text" id="dynamic-message">Loading...</h1>

    <div class="button-group">
      <button class="btn btn-yes">Yes ✨</button>
      <button class="btn btn-no">No 🙈</button>
    </div>
    
    <p class="subtext">"No" seems a bit shy 😈</p>

    <!-- Calendar Section (Shows after clicking Yes) -->
    <div class="date-section" id="date-section">
      <input type="date" id="date-picker" class="date-input">
      <p class="date-error" id="date-error">Please pick a date first! 📅</p>
      <button class="btn btn-yes" id="confirm-date">Confirm Date 💌</button>
    </div>
  </div>

  <!-- Script to handle dynamic text, calendar, and moving button -->
  <script>
    // 1. YOUR CUSTOM TEXT
    const customText = "Will you go on a dinner date with me? 🍽️✨";
    document.getElementById('dynamic-message').innerText = customText;

    // 2. YOUR FORMSPREE ENDPOINT URL
    const formEndpoint = "https://formspree.io/f/xykrenzr"; 

    // Prevent picking past dates
    const datePicker = document.getElementById('date-picker');
    const today = new Date().toISOString().split('T')[0];
    datePicker.setAttribute('min', today);

    // 3. SHOW CALENDAR WHEN SHE CLICKS YES
    document.querySelector('.btn-yes').addEventListener('click', function() {
      const messageElement = document.getElementById('dynamic-message');
      const buttonsElement = document.querySelector('.button-group');
      const subtextElement = document.querySelector('.subtext');
      const noButtonElement = document.querySelector('.btn-no');
      const dateSection = document.getElementById('date-section');

      // Hide initial buttons and show calendar
      buttonsElement.style.display = 'none';
      if (subtextElement) subtextElement.style.display = 'none';
      noButtonElement.style.display = 'none';

      messageElement.innerText = "Yayy! Pick a date for our dinner 🍽️";
      document.querySelector('.icon-placeholder').innerHTML = "😻<span class='heart-badge'>❤️</span>";
      dateSection.style.display = 'flex';

      // Open the native calendar automatically on supported browsers
      if (datePicker.showPicker) {
        try {
          datePicker.showPicker();
        } catch (e) {}
      }
    });

    // 4. SEND RESPONSE + SELECTED DATE TO FORMSPREE
    document.getElementById('confirm-date').addEventListener('click', function() {
      const selectedDate = datePicker.value;
      const dateError = document.getElementById('date-error');

      if (!selectedDate) {
        dateError.style.display = 'block';
        return;
      }

      dateError.style.display = 'none';
      sendResponse('Yes', selectedDate);
    });

    function sendResponse(answer, chosenDate) {
      const messageElement = document.getElementById('dynamic-message');
      const dateSection = document.getElementById('date-section');

      dateSection.style.display = 'none';
      messageElement.innerText = "Sending... 💌";

      fetch(formEndpoint, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          Answer: `She clicked: ${answer}`,
          Selected_Date: chosenDate,
          Submitted_At: new Date().toLocaleString()
        })
      })
      .then(response => {
        if (response.ok) {
          messageElement.innerText = `Yayy! See you on ${chosenDate}! ✨`;
        } else {
          messageElement.innerText = "Oops, my internet broke. Tell me in person! 😅";
        }
      })
      .catch(error => {
        messageElement.innerText = "Oops, my internet broke. Tell me in person! 😅";
      });
    }
    // ---------------------------------------------------------
    // 5. THE RUNAWAY "NO" BUTTON LOGIC (FIXED FOR LAPTOP/CARD TRAP)
    // ---------------------------------------------------------
    const noButton = document.querySelector('.btn-no');

    function moveButton() {
      // THE FIX: We must move the button entirely out of the glass card 
      // and append it to the main body so the browser measures from the screen edges!
      if (noButton.parentElement !== document.body) {
        document.body.appendChild(noButton);
      }

      // Get the actual inner size of the browser window
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      // Get the button's size
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      // SET A BUFFER (50 pixels) so it doesn't touch the edges
      const buffer = 50;

      // Calculate the maximum X and Y coordinates (Window size - button size - buffer zone)
      const maxX = windowWidth - buttonWidth - buffer;
      const maxY = windowHeight - buttonHeight - buffer;

      // Generate random coordinates
      const randomX = Math.max(buffer, Math.floor(Math.random() * maxX));
      const randomY = Math.max(buffer, Math.floor(Math.random() * maxY));

      // Apply the new position
      noButton.style.position = 'fixed';
      noButton.style.left = `${randomX}px`;
      noButton.style.top = `${randomY}px`;
      
      // Add a smooth transition so it glides away
      noButton.style.transition = 'all 0.2s ease-out';
    }

    // Move it when a computer mouse hovers over it
    noButton.addEventListener('mouseover', moveButton);

    // Move it when a phone finger tries to tap it
    noButton.addEventListener('touchstart', function(event) {
      event.preventDefault(); // Stops the tap from registering
      moveButton();
    });
  </script>

</body>
</html>
